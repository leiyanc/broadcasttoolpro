services:
  - type: web
    name: broadcast-tool-pro-staging
    runtime: python
    plan: starter
    region: virginia
    branch: staging
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    initialDeployHook: python -m tools.bootstrap_admin
    healthCheckPath: /health
    disk:
      name: broadcast-tool-pro-staging-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BTP_ENV
        value: staging
      - key: BTP_COOKIE_SECURE
        value: "true"
      - key: BTP_ALLOW_WEB_BOOTSTRAP
        value: "false"
      - key: BTP_DATA_DIR
        value: /opt/render/project/src/data
      - key: BTP_BACKUP_DIR
        value: /opt/render/project/src/data/backups
      - key: BTP_BACKUP_RETENTION_DAYS
        value: "14"
      - key: BTP_GOOGLE_DRIVE_TOKEN
        value: /opt/render/project/src/data/google-drive/google-drive-token.json
      - key: BTP_BACKUP_ENCRYPTION_KEY
        value: /opt/render/project/src/data/google-drive/backup-encryption.key
      - key: BTP_GOOGLE_DRIVE_STATE
        value: /opt/render/project/src/data/google-drive/google-drive-state.json
      - key: BTP_REQUIRE_REMOTE_BACKUP
        value: "true"
      - key: BTP_TEMP_RETENTION_HOURS
        value: "24"
      - key: BTP_PAYMENT_GRACE_HOURS
        value: "72"
      - key: BTP_EMAIL_PROVIDER
        value: ses
      - key: BTP_SES_REGION
        value: us-east-1
      - key: BTP_EMAIL_FROM
        sync: false
      - key: BTP_EMAIL_REPLY_TO
        sync: false
      - key: BTP_SES_SNS_TOPIC_ARN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BTP_APPLICATION_URL
        sync: false
      - key: BTP_INITIAL_ORGANIZATION_NAME
        sync: false
      - key: BTP_INITIAL_ADMIN_NAME
        sync: false
      - key: BTP_INITIAL_ADMIN_EMAIL
        sync: false
      - key: BTP_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: BTP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: BTP_STRIPE_SECRET_KEY
        sync: false
      - key: BTP_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BTP_STRIPE_PRICE_PROGRAMMING
        sync: false
      - key: BTP_STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: BTP_STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: BTP_STRIPE_PRICE_STREAM_MONITORING
        sync: false
